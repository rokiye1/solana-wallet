<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solana Wallet Pro V3</title>

  <link rel="stylesheet" href="style.css">

  <!-- Solana Web3 -->
  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>

  <!-- QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

<div class="background blur1"></div>
<div class="background blur2"></div>

<div class="app">

<header>

<div class="logo">
<h1>🟣 Solana Wallet Pro V3</h1>
<p>Fast • Secure • Decentralized</p>
</div>

<button id="themeBtn">🌙</button>

</header>

<div class="wallet-card">

<div class="wallet-top">

<div>
<h2 id="status">🔴 Wallet Not Connected</h2>
<p id="networkStatus">Current : Mainnet</p>
</div>

<div class="wallet-actions">
<button id="connectBtn">Connect Wallet</button>
<button id="disconnectBtn">Disconnect</button>
</div>

</div>

<hr>
<div class="balance-card">

  <p>Total Balance</p>
  <h1 id="balance">0 SOL</h1>

  <button id="refreshBtn">
    🔄 Refresh Balance
  </button>

</div>

<div class="address-card">

  <h3>Wallet Address</h3>

  <p id="address">
    Not Connected
  </p>

  <div id="qrcode"></div>

  <div class="address-buttons">

    <button id="copyBtn">
      📋 Copy Address
    </button>

    <button id="receiveBtn">
      📥 Receive
    </button>

  </div>

</div>

<div class="network-card">

  <h3>Network</h3>

  <select id="network">
    <option value="mainnet-beta" selected>Mainnet</option>
    <option value="devnet">Devnet</option>
    <option value="testnet">Testnet</option>
  </select>

</div>
<div class="send-card">

  <h3>Send SOL</h3>

  <input
    type="text"
    id="receiver"
    placeholder="Receiver Wallet Address"
  >

  <input
    type="number"
    id="amount"
    placeholder="Amount (SOL)"
    step="0.0001"
  >

  <button id="sendBtn">
    🚀 Send SOL
  </button>

</div>

<div class="history-card">

  <h3>📜 Transaction History</h3>

  <ul id="history">
    <li>No transactions found.</li>
  </ul>

</div>

<footer>
  <p>Solana Wallet Pro V3 © 2026</p>
</footer>

</div>

<script src="script.js"></script>

</body>
</html>
