<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solana Wallet Pro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <div class="wallet-card">

    <div class="top-bar">
      <h1>🟣 Solana Wallet Pro</h1>
      <button id="themeBtn">🌙</button>
    </div>

    <p id="status">🔴 Wallet Not Connected</p>

    <div class="action-buttons">
      <button id="connectBtn">🔗 Connect Wallet</button>
      <button id="disconnectBtn">❌ Disconnect</button>
    </div>

    <div class="network-card">
      <h3>🌐 Network</h3>

      <select id="network">
        <option value="Mainnet">Mainnet</option>
        <option value="Devnet">Devnet</option>
        <option value="Testnet">Testnet</option>
      </select>

      <p id="networkStatus">Current : Mainnet</p>
    </div>

    <div class="balance-card">

      <h2>💰 Wallet Balance</h2>

      <p id="balance">0 SOL</p>

      <button id="refreshBtn">🔄 Refresh Balance</button>

    </div>    <div class="wallet-info">

      <h2>💼 Wallet Information</h2>

      <p><strong>Wallet Address</strong></p>
      <p id="address">Not Connected</p>

      <button id="copyBtn">📋 Copy Address</button>

      <button id="receiveBtn">📥 Receive</button>

      <div id="qrBox">
        <img
          id="qrImage"
          src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=DemoWallet123456789"
          alt="QR Code">
      </div>

      <button id="sendBtn">📤 Send SOL</button>

    </div>

    <div class="history-card">

      <h2>📜 Transaction History</h2>

      <ul id="history">
        <li>No transactions yet.</li>
      </ul>

    </div>

  </div>

</div>
<script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
<script src="script.js"></script>
<script src="script.js"></script>

</body>
</html>
